# -----------------------------------------------------------------------------
# Source theme-generated colors
# -----------------------------------------------------------------------------
# colors.conf is generated by `dots theme apply` (or falls back to the tokyo-night
# default shipped with this component). Re-run `dots theme apply <theme>` to
# regenerate; in a running tmux server, hit <prefix> r to reload.

source-file -q ~/.config/tmux/colors.conf

# -----------------------------------------------------------------------------
# Prefix: Ctrl-b to Ctrl-a
# -----------------------------------------------------------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# -----------------------------------------------------------------------------
# General
# -----------------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",*:RGB,*:osc7"

## Scroll with mouse
set -g mouse on

## Copy and clear selection without exiting copy-mode on mouse release
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

## Long history
set -g history-limit 100000

## Extended keys
set -g extended-keys on
set -g extended-keys-format csi-u

# -----------------------------------------------------------------------------
# 1-based indices (more natural)
# -----------------------------------------------------------------------------

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# -----------------------------------------------------------------------------
# Panel split
# -----------------------------------------------------------------------------

## Quick Vim-style splitting (with SSH and CWD preservation)
bind | run-shell "~/.config/tmux/ssh_split.sh -h #{pane_pid} '#{pane_current_path}'"
bind - run-shell "~/.config/tmux/ssh_split.sh -v #{pane_pid} '#{pane_current_path}'"
bind c new-window -c "#{pane_current_path}"

# -----------------------------------------------------------------------------
# Panel navitation
# -----------------------------------------------------------------------------

## Vim-style navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

## Prefix-free mode (Alt + arrow keys)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

## Prefix-free window navigation (Shift + Left/Right)
bind -n S-Left  previous-window
bind -n S-Right next-window

## Move window left/right (Ctrl + Shift + Left/Right)
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

## Window/session management (Prefix + Shift + W/Q)
bind W kill-window
bind Q kill-session

# -----------------------------------------------------------------------------
# Reload config
# -----------------------------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# ==========================================
# STYLING & VISUAL IMPROVEMENTS
# ==========================================
#
# All color references below use @color_* variables defined in colors.conf.
# The default colors.conf (shipped with this component) is tokyo-night.
# Apply a different palette with: `dots theme apply <theme>`.

# Status bar options
set -g status "on"
set -g status-position "top"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Main status bar style
set -gF status-style "bg=#{@color_bg},fg=#{@color_fg}"

# Status Left: Session Name (rendered as an elegant block/pill using the accent color, changing to red with ^A when prefix is pressed)
set -gF status-left "#[bg=##{?client_prefix,#{@color_red},#{@color_accent}},fg=#{@color_accent_text},bold] ##S##{?client_prefix, ^A,} #[nobold]"

# Window status tabs
set -gF window-status-separator "#[fg=#{@color_bright_black}]/"
set -gF window-status-format "#[fg=#{@color_bright_black},bg=#{@color_bg}]  ##I:##W  "
set -gF window-status-current-format "#[fg=#{@color_selection_fg},bold]  ##I:##W  "

# Status Right: Host, Date, Time (clean, minimal styling with colored highlights)
set -gF status-right "#[fg=#{@color_fg}]%d-%m-%Y #[fg=#{@color_bright_black}]│ #[fg=#{@color_fg}]%H:%M #[bg=#{@color_accent},fg=#{@color_accent_text},bold] ##{?@pane_ssh_host,##{@pane_ssh_host},##h} "

# Pane borders styling
set -gF pane-border-style "fg=#{@color_bright_black},bg=default"
set -gF pane-active-border-style "fg=#{@color_accent},bg=default"

# Command line/Message prompt (when pressing Prefix + :)
set -gF message-style "fg=#{@color_accent},bg=#{@color_bg},bold"
set -gF message-command-style "fg=#{@color_accent},bg=#{@color_bg},bold"

# Selection/Copy Mode highlight
set -gF mode-style "fg=#{@color_selection_fg},bg=#{@color_selection_bg}"

# Activity alerts on window
set -gF window-status-activity-style "fg=#{@color_red},bg=#{@color_bg},bold"

# Clock mode
set -gF clock-mode-color "#{@color_accent}"
